version: "2"

linters:
  default: none
  enable:
    - exhaustive
    - govet
    - errcheck
    - staticcheck
    - unused
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -S1016

formatters:
  enable:
    - gofmt
